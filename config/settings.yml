plugins:
  chat_demo_enabled:
    default: false
    client: true
  chat_demo_game_name:
    default: "Deep Rock Galactic"
    client: false
  chat_demo_messages_per_minute:
    default: 6
    min: 1
    max: 30
    client: false
  # Leave blank to use the plugin's built-in agent. Set to a Discourse AI agent
  # to drive generation with a prompt/tools/model configured in the admin UI.
  chat_demo_agent_id:
    default: ""
    type: enum
    enum: "DiscourseAi::Configuration::AgentEnumerator"
    client: false
  chat_demo_script_lines:
    default: 100
    min: 20
    max: 1000
    client: false
  # The chat channel the demo posts into. Defaults to the "General" channel
  # Discourse ships with (id 2), so the plugin reuses it instead of creating a
  # second general-style channel.
  chat_demo_channel_id:
    default: 2
    client: false
